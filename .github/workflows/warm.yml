name: Warm rates
# Keeps the CDN copy of /api/rates fresh and prints a short health summary in the run log.
on:
  schedule: [{cron: "*/15 * * * *"}]
  workflow_dispatch:
jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Rates
        run: |
          set +e
          SITE="${{ vars.SITE_URL || 'https://ratewatch-lemon.vercel.app' }}"
          curl -sS -m 60 "$SITE/api/rates" -o rates.json -w 'HTTP %{http_code} in %{time_total}s\n'
          python3 - <<'PY'
          import json
          try: d = json.load(open("rates.json"))
          except Exception as e: print("not JSON:", e, open("rates.json").read()[:300]); raise SystemExit
          if "error" in d: print("ERROR:", d["error"]); raise SystemExit
          print("T-bill:", d.get("tbill"), "| rows:", len(d["rows"]), "| built in", d.get("ms"), "ms")
          for c in d["cats"]: print(f'  {c["id"]:10} {c["count"]:3} yields  median {c["median"]}  tvl {c["tvl"]/1e9:.1f}B')
          for r in sorted(d["rows"], key=lambda r: -r["tvl"])[:40]: print(f'  {r["cat"]:9} {r["project"]:28} {r["symbol"]:12} {r["apy30"] or 0:6.2f}%  {r["tvl"]/1e6:8.0f}M  {",".join(r["chains"][:4])}')
          open("top", "w").write(max(d["rows"], key=lambda r: r["tvl"])["id"])
          open("slugs", "w").write(" ".join(r["slug"] for r in d["rows"] if "slug" in r))
          open("funds", "w").write(" ".join(r["slug"] for r in d["rows"] if r["cat"] == "tbill"))
          PY
          [ -s slugs ] && echo "pages: $(wc -w < slugs), e.g. $(tr ' ' '\n' < slugs | head -12 | tr '\n' ' ')" && S=$(cut -d' ' -f1 slugs) &&
            curl -sS -m 60 -o /dev/null "$SITE/y/$S" -w "page /y/$S: HTTP %{http_code} %{content_type} %{size_download}B\n" &&
            curl -sS -m 60 -o /dev/null "$SITE/api/og?p=y&s=$S" -w "share image: HTTP %{http_code} %{content_type} %{size_download}B %{redirect_url}\n" &&
            curl -sS -m 60 -o /dev/null "$SITE/api/og?p=home" -w "home image: HTTP %{http_code} %{content_type} %{size_download}B %{redirect_url}\n"
          echo "funds page: $(curl -sS -m 60 "$SITE/funds" | grep -o '<tr data-us' | wc -l) funds, $(curl -sS -m 60 -o /dev/null "$SITE/api/og?p=funds" -w 'image HTTP %{http_code} %{content_type} %{size_download}B %{redirect_url}')"
          for C in usdc usdt usds dai usde pyusd usdg gho rlusd usd1; do echo "coin /$C: $(curl -sS -m 60 -o c.html -w '%{http_code}' "$SITE/$C") $(grep -o '<a class="tok rowlink"' c.html | wc -l) yields"; done
          for F in $(cat funds 2>/dev/null); do echo "fund /y/$F: $(curl -sS -m 60 "$SITE/y/$F" | grep -c 'Who can hold it') who-can-hold section(s)"; done
          [ -f top ] && curl -sS -m 30 "$SITE/api/history?pool=$(cat top)" | python3 -c 'import json,sys; h=json.load(sys.stdin); p=h.get("points",[]); print("history:", len(p), "days", p[:1], p[-1:], h.get("error",""))'
      - name: Check alerts
        run: curl -sS -m 90 "${{ vars.SITE_URL || 'https://ratewatch-lemon.vercel.app' }}/api/check-alerts"; echo
